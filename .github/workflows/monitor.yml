name: Monitor Policia Nacional - Jamundi

on:
  schedule:
    - cron: "29 12 * * *" # Revision ligera diaria, 07:29 America/Bogota
  workflow_dispatch:
    inputs:
      force_process:
        description: "Forzar descarga y procesamiento aunque la huella no cambie"
        required: false
        default: false
        type: boolean
      notify:
        description: "Enviar correo si se detectan cambios"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: monitor-policia-nacional
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencia de revision ligera
        run: pip install requests

      - name: Calcular fingerprint remoto
        id: fp
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python official_policia_source.py --fingerprint | tee fp.out
          FP="$(tail -n 1 fp.out)"
          echo "hash=$FP" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $FP"

      - name: Cache policia_xlsx + estado (por fingerprint)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            policia_xlsx
            .monitor_state
          key: policia-cache-${{ steps.fp.outputs.hash }}
          restore-keys: |
            policia-cache-

      - name: Decidir si ejecutar descarga completa
        id: cambios
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_process }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar resumen anterior (si existe)
        if: steps.cambios.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p .monitor_state
          if [ -f .monitor_state/resumen_actual.json ]; then
            cp .monitor_state/resumen_actual.json resumen_anterior.json
          fi

      - name: Instalar dependencias de procesamiento
        if: steps.cambios.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Descargar archivos oficiales consolidados
        if: steps.cambios.outputs.changed == 'true'
        timeout-minutes: 12
        run: python official_policia_source.py --download

      - name: Generar boletin PDF
        if: steps.cambios.outputs.changed == 'true'
        run: python generar_reporte_policia.py

      - name: Notificar por correo si hubo cambios
        if: steps.cambios.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.notify == true)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
        shell: bash
        run: |
          python notificar_policia.py cambio

      - name: Registrar revision sin cambios
        if: steps.cambios.outputs.changed != 'true'
        run: echo "Sin cambios remotos; no se descargaron archivos ni se envio correo."

      - name: Guardar nuevo estado
        if: steps.cambios.outputs.changed == 'true' && hashFiles('resumen_actual.json') != ''
        shell: bash
        run: |
          mkdir -p .monitor_state
          cp resumen_actual.json .monitor_state/resumen_actual.json
          cp source_status.json .monitor_state/source_status.json

      - name: Reportar estado al Centro de fuentes SISC
        if: always()
        continue-on-error: true
        env:
          SISC_API_URL: "https://sisc-backend.onrender.com/api"
          SISC_MONITOR_OUTCOME: ${{ job.status }}
          DATA_CHANGED: ${{ steps.cambios.outputs.changed }}
        run: python sisc_heartbeat.py

      - name: Subir artefactos cuando cambia
        if: steps.cambios.outputs.changed == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-policia
          path: |
            reporte_policia.pdf
            resumen_actual.json
            source_status.json
            graf_comp_policia.png
            graf_tend_policia.png
            fallo_*.png

      - name: Conservar reporte SISC para sincronizacion local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sisc-heartbeat
          path: sisc-heartbeat.json
          if-no-files-found: warn
          retention-days: 30
